services:
  # 1. DATABASE MYSQL
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'kapanlagi?'
      MYSQL_DATABASE: db_tbcheckv3
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: 'kapanlagi?'
    depends_on:
      - db

  # 3. BACKEND FLASK AI
  backend-ai:
    build: ./backend_skrining_tbc
    ports:
      - "5000:5000"
    restart: unless-stopped
    # volumes:
    #   - ./backend_skrining_tbc:/app  <-- Dimatikan agar tidak menimpa file Docker
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1   
              # <-- Ditambahkan agar log langsung muncul
      - ENCRYPTION_KEY=rahasia-kunci-enkripsi-tbc-2026!
      - AES_SECRET_KEY=SkripsiAman12345
    depends_on:
      - db

  # 4. FRONTEND NEXT.JS
  frontend-web:
    build: ./frontend_skrining_tbc
    ports:
      - "3000:3000"
    restart: unless-stopped
    # volumes:
    #   - ./frontend_skrining_tbc:/app <-- Dimatikan agar folder .next tidak hilang
    #   - /app/node_modules
    depends_on:
      - backend-ai
    

volumes:
  db_data: